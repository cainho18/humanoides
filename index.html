<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de Coerência · v3 — motor + enxame</title>
<style>
:root{
  --heartstorm:#FF00AA; --jester:#FFFF00; --deepwave:#42173E; --soulcraft:#722767;
  --ink:#12060F; --ink-2:#1B0B18; --ink-3:#25102170;
  --paper:#FBF8FA; --paper-2:#F1EAEF;
  --line:#3A1E36; --line-soft:#2A1428;
  --dim:#9A85A0; --dim-2:#6E5A76;
  --ok:#39D98A; --warn:#FFB020; --bad:#FF4D6D;
  --mono:'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3A1E36;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:var(--soulcraft)}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100vh}
header.top{display:flex;align-items:center;gap:18px;height:56px;flex:0 0 56px;
  padding:0 20px;border-bottom:1px solid var(--line);background:var(--ink-2)}
.brand{font-family:var(--mono);font-size:12px;letter-spacing:.22em;font-weight:600}
.brand .dot{color:var(--heartstorm)}
.steps{display:flex;gap:2px;margin-left:auto}
.step-chip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:5px 11px;
  border:1px solid var(--line-soft);border-style:dashed;color:var(--dim-2);background:transparent;
  transition:color .25s,border-color .25s,background .25s}
.step-chip.done{border-style:solid;border-color:var(--line);color:var(--dim);background:#1E0C1B}
.step-chip.done::after{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--ok);margin-left:7px;vertical-align:middle}
.step-chip.active{border-style:solid;border-color:var(--heartstorm);color:var(--paper);background:#2A0B22}

main{flex:1;display:flex;min-height:0}
.panel{display:flex;flex-direction:column;min-height:0;min-width:0}
.panel.left{flex:1 1 58%;border-right:1px solid var(--line)}
.panel.right{flex:1 1 42%;background:#0E040C}
.panel-hd{flex:0 0 auto;padding:11px 18px;border-bottom:1px solid var(--line-soft);
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dim-2);
  display:flex;align-items:center;gap:10px}
.panel-bd{flex:1;overflow-y:auto;padding:22px}
.panel-bd.tight{padding:0}

footer.term{flex:0 0 104px;background:#000;border-top:1px solid var(--line);
  overflow-y:auto;padding:8px 16px;font-family:var(--mono);font-size:10.5px;line-height:1.7;color:#7BE0B0}
footer.term .t{color:#4B3A50;margin-right:8px}
footer.term .w{color:var(--warn)} footer.term .e{color:var(--bad)} footer.term .h{color:var(--heartstorm)}

/* ---------- primitives ---------- */
.card{border:1px solid var(--line);background:var(--ink-2);padding:18px;margin-bottom:16px}
.card .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dim-2);margin-bottom:4px}
h1,h2,h3{margin:0 0 10px;font-weight:600;letter-spacing:-.01em}
h1{font-size:24px} h2{font-size:17px} h3{font-size:14px}
p{margin:0 0 12px} p:last-child{margin-bottom:0}
.muted{color:var(--dim)} .small{font-size:12.5px}
.mono{font-family:var(--mono)}
label.f{display:block;margin-bottom:14px}
label.f > span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  color:var(--dim-2);margin-bottom:6px}
input.i,select.i,textarea.i{width:100%;background:#0B030A;border:1px solid var(--line);
  color:var(--paper);padding:9px 11px;outline:none;font-family:var(--mono);font-size:12.5px}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--heartstorm)}
.row{display:flex;gap:14px} .row > *{flex:1}
.btn{background:var(--heartstorm);color:#12060F;border:none;padding:11px 22px;font-weight:700;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;transition:transform .12s,filter .2s}
.btn:hover:not(:disabled){filter:brightness(1.12)} .btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{background:#2A1428;color:#5A4560;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--paper)}
.btn.ghost:hover{border-color:var(--heartstorm)}
.btn.sm{padding:7px 14px;font-size:10px}
.pill{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  padding:3px 8px;border:1px solid var(--line);color:var(--dim);margin:0 5px 5px 0}
.pill.on{border-color:var(--heartstorm);color:var(--heartstorm)}
.pill.y{border-color:var(--jester);color:var(--jester)}
.hr{height:1px;background:var(--line-soft);margin:20px 0}
.err{border-left:2px solid var(--bad);background:#2A0C14;padding:11px 14px;margin-bottom:14px;font-size:12.5px}
.note{border-left:2px solid var(--soulcraft);background:#1C0A1A;padding:11px 14px;font-size:12.5px;color:var(--dim)}

/* ---------- ações ---------- */
.bloco{margin-bottom:26px}
.bloco-hd{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.bloco-hd .n{font-family:var(--mono);font-size:11px;color:var(--heartstorm);letter-spacing:.16em}
.bloco-hd .c{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim-2)}
.bloco-q{font-family:var(--serif);font-style:italic;color:var(--dim);margin-bottom:12px;font-size:13.5px}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.acao{border:1px solid var(--line-soft);background:#160718;padding:11px 13px;cursor:pointer;
  transition:border-color .18s,background .18s;position:relative}
.acao:hover{border-color:var(--soulcraft)}
.acao.on{border-color:var(--heartstorm);background:#2A0B22}
.acao .id{font-family:var(--mono);font-size:9.5px;color:var(--dim-2);letter-spacing:.1em}
.acao.on .id{color:var(--heartstorm)}
.acao .nm{font-size:12.5px;font-weight:600;margin-top:2px;line-height:1.35}
.acao .tn{font-size:11px;color:var(--dim-2);margin-top:5px;font-style:italic}
.acao .exp{display:none;margin-top:9px;padding-top:9px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--dim)}
.acao.open .exp{display:block}
.acao .exp b{color:var(--paper);font-weight:600}
.acao .more{position:absolute;top:9px;right:10px;font-family:var(--mono);font-size:10px;color:var(--dim-2);
  border:1px solid var(--line-soft);width:17px;height:17px;line-height:15px;text-align:center}
.acao .more:hover{color:var(--jester);border-color:var(--jester)}

/* ---------- personas ---------- */
.personas{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.persona{border:1px solid var(--line-soft);background:#160718;padding:11px 13px;cursor:pointer;
  animation:pop .35s cubic-bezier(.165,.84,.44,1)}
.persona:hover{border-color:var(--soulcraft)}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.persona .av{width:26px;height:26px;background:var(--soulcraft);color:#fff;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;margin-right:9px;float:left}
.persona .nm{font-size:12.5px;font-weight:600;line-height:1.3}
.persona .cg{font-family:var(--mono);font-size:9.5px;color:var(--dim-2);letter-spacing:.06em}
.persona .bio{clear:both;font-size:11.5px;color:var(--dim);margin-top:7px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- feed de ações do enxame ---------- */
.fala{border-left:2px solid var(--line);padding:9px 0 9px 13px;margin-bottom:11px;
  animation:pop .4s cubic-bezier(.165,.84,.44,1)}
.fala.adere{border-left-color:var(--ok)}
.fala.cumpre_sem_crer{border-left-color:var(--warn)}
.fala.resiste{border-left-color:var(--bad)}
.fala.reinterpreta{border-left-color:var(--jester)}
.fala.propoe_alternativa{border-left-color:var(--heartstorm)}
.fala.sai{border-left-color:#7A7A7A}
.fala.silencia{border-left-color:#4A3A50}
.fala .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.fala .who{font-size:12px;font-weight:600}
.fala .rl{font-family:var(--mono);font-size:9.5px;color:var(--dim-2)}
.fala .ps{font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:2px 6px;border:1px solid currentColor}
.fala .tx{font-family:var(--serif);font-size:13.5px;margin-top:6px;color:#EDE4EA}
.fala .ef{margin-top:6px;font-family:var(--mono);font-size:9.5px;color:var(--dim-2)}
.fala .ef i{font-style:normal} .fala .ef .p{color:var(--ok)} .fala .ef .n{color:var(--bad)}

/* ---------- marcos / resultado ---------- */
.marco{border:1px solid var(--line);margin-bottom:16px;background:var(--ink-2)}
.marco.pend{border-style:dashed;opacity:.45}
.marco-hd{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line-soft)}
.marco-hd .yr{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:.04em}
.marco.pend .yr{color:#4A3A50}
.marco-hd .fq{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;padding:3px 9px;border:1px solid}
.fq.humana{color:var(--ok);border-color:var(--ok)}
.fq.maquina{color:var(--warn);border-color:var(--warn)}
.fq.sintomas{color:var(--bad);border-color:var(--bad)}
.fq.transicao{color:var(--dim);border-color:var(--line)}
.marco-bd{padding:16px 18px}
.contas{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.conta{border:1px solid var(--line-soft);padding:12px}
.conta .lb{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--dim-2)}
.conta .vl{font-family:var(--mono);font-size:27px;font-weight:700;line-height:1.15;margin:3px 0}
.conta .bd{font-family:var(--mono);font-size:10px;color:var(--dim-2)}
.reservas{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:14px}
.res{text-align:center}
.res .rn{font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;color:var(--dim-2);
  height:22px;display:flex;align-items:center;justify-content:center}
.res .bar{height:52px;background:#0B030A;border:1px solid var(--line-soft);position:relative;overflow:hidden}
.res .fill{position:absolute;bottom:0;left:0;right:0;transition:height .5s cubic-bezier(.25,.8,.25,1)}
.res .band{position:absolute;left:0;right:0;background:#ffffff10;border-top:1px solid #ffffff2e;border-bottom:1px solid #ffffff2e}
.res .rv{font-family:var(--mono);font-size:11px;font-weight:700;margin-top:3px}
.narr{font-family:var(--serif);font-size:14.5px;line-height:1.68;color:#EDE4EA;margin-top:4px}
.narr .q{border-left:2px solid var(--heartstorm);padding-left:12px;margin:12px 0;color:var(--dim);font-size:13.5px}
.crise{display:flex;gap:2px;height:7px;margin:11px 0 6px}
.crise > i{display:block}
.crise-lb{font-family:var(--mono);font-size:9.5px;color:var(--dim-2)}

/* ---------- calibração do enxame ---------- */
.calib{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.cal{border:1px solid var(--line-soft);padding:9px 11px}
.cal .cl{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--dim-2)}
.cal .cv{font-family:var(--mono);font-size:18px;font-weight:700}

/* ---------- gráfico ---------- */
.chart{width:100%;height:230px;background:#0B030A;border:1px solid var(--line-soft)}

/* ---------- chat / entrevista ---------- */
.chat{display:flex;flex-direction:column;gap:11px;margin-bottom:14px}
.msg{max-width:86%;padding:10px 13px;font-size:13px;line-height:1.55}
.msg.u{align-self:flex-end;background:#2A0B22;border:1px solid var(--soulcraft)}
.msg.a{align-self:flex-start;background:#160718;border:1px solid var(--line-soft);font-family:var(--serif);font-size:13.5px}
.alvo{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.alvo .t{border:1px solid var(--line-soft);padding:8px 11px;cursor:pointer;font-size:12px}
.alvo .t:hover{border-color:var(--soulcraft)}
.alvo .t.on{border-color:var(--heartstorm);background:#2A0B22}

/* ---------- progresso ---------- */
.prog{height:2px;background:#2A1428;margin:12px 0}
.prog > i{display:block;height:100%;background:var(--heartstorm);transition:width .4s}
.spin{display:inline-block;width:11px;height:11px;border:1.5px solid var(--line);
  border-top-color:var(--heartstorm);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
.dotpulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--heartstorm);
  animation:dp 1.5s ease-in-out infinite}
@keyframes dp{0%,100%{box-shadow:0 0 0 0 #FF00AA88}50%{box-shadow:0 0 0 5px #FF00AA00}}
.hide{display:none !important}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">GZERO<span class="dot">·</span>CALCULADORA DE COERÊNCIA <span style="color:var(--dim-2)">v3</span></div>
    <div class="steps" id="steps"></div>
  </header>
  <main>
    <section class="panel left">
      <div class="panel-hd" id="hdL">ETAPA</div>
      <div class="panel-bd" id="bdL"></div>
    </section>
    <section class="panel right">
      <div class="panel-hd" id="hdR">SALA DE MÁQUINAS</div>
      <div class="panel-bd" id="bdR"></div>
    </section>
  </main>
  <footer class="term" id="term"></footer>
</div>
<script>
/* ===== DADOS DAS 36 AÇÕES ===== */
/* ==========================================================================
   TABELA DE AÇÕES — 36 ações refinadas v2.0 (6 blocos × 6)
   --------------------------------------------------------------------------
   Cada ação carrega:
     y   : impulso médio sobre DESEMPENHO (μ_Y)
     r   : [Confiança, Sentido, Folga, Autoria, Plasticidade, Vínculo] (μ_Rj)
     ty  : atraso do efeito no desempenho, em anos (τ_Y)
     tr  : atraso do efeito no substrato, em anos (τ_R)
     brilha / sombra / tensao : texto do material das 36 ações
     sens: palavras-chave que ajudam o enxame a saber quem essa ação toca

   ⚠️ CALIBRAÇÃO: os números abaixo são a 1ª versão ILUSTRATIVA, derivada do
   "Brilha em / Sombra / Tensão central" de cada ação. Continuam pendentes de
   ancoragem empírica (Natura, Sanofi, Siemens etc.). Editar aqui é o ponto
   único de calibração do motor.
   ========================================================================== */

const RESERVAS = [
  { id: 'confianca',    nome: 'Confiança',    desc: 'o crédito que sustenta coordenação sem controle' },
  { id: 'sentido',      nome: 'Sentido',      desc: 'por que o trabalho importa para quem o faz' },
  { id: 'folga',        nome: 'Folga',        desc: 'a margem que permite absorver choque e criar' },
  { id: 'autoria',      nome: 'Autoria',      desc: 'assinatura própria contra reprodução vazia' },
  { id: 'plasticidade', nome: 'Plasticidade', desc: 'a capacidade de mudar sem quebrar' },
  { id: 'vinculo',      nome: 'Vínculo',      desc: 'a infraestrutura relacional que segura a rede' }
];

const BLOCOS = [
  { id: 1, nome: 'CORE BUSINESS',          questao: 'Que tipo de valor você cria — e para quem?' },
  { id: 2, nome: 'PESSOAS E ENTRADA',      questao: 'Quem entra — e quem se forma aqui?' },
  { id: 3, nome: 'TECNOLOGIA E TRABALHO',  questao: 'O que fazemos juntos, o que fazemos com máquinas, o que deixamos para elas?' },
  { id: 4, nome: 'GOVERNANÇA E PODER',     questao: 'Quem decide o quê — e como se decide o que decidir?' },
  { id: 5, nome: 'CAPITAL E PROPÓSITO',    questao: 'Para quem trabalhamos — e quem colhe o valor que criamos?' },
  { id: 6, nome: 'ECOSSISTEMA E CADEIA',   questao: 'Quem está conosco nessa jornada — e como tratamos quem nos sustenta?' }
];

const ACOES = {
  /* ---------- BLOCO 1 — CORE BUSINESS ---------- */
  '1.1': { nome:'Receita Recorrente sobre Solução Definitiva',
    oque:'Priorizar modelos que geram receita contínua em vez de soluções que resolvem o problema de uma vez.',
    brilha:'Mercados maduros com baixa margem; P&D caro cujo retorno precisa ser diluído; quando a recorrência dá previsibilidade.',
    sombra:'Conflito de interesse com o cliente; desincentivo à "cura definitiva"; vulnerabilidade a quem resolve de verdade.',
    tensao:'Previsibilidade financeira vs. propósito de resolver de verdade.',
    y: 8, r:[-2,-4, 1,-1,-2, 2], ty:1, tr:4, sens:['produto','comercial','cliente','P&D'] },
  '1.2': { nome:'Acesso Ampliado com Margem Reduzida',
    oque:'Estruturar preços e programas para que pessoas de menor renda tenham acesso, aceitando menor margem em parte do volume.',
    brilha:'Grande base de usuários; escala compensa margem; propósito social como diferencial; pressão regulatória ou reputacional.',
    sombra:'Lido como "caridade de marketing"; acionistas questionam; difícil de reverter; atrai competição predatória.',
    tensao:'Inclusão real vs. sustentabilidade financeira.',
    y:-2, r:[ 3, 5,-2, 2, 1, 4], ty:2, tr:3, sens:['comercial','cliente','marca','finanças'] },
  '1.3': { nome:'Aposta em Problemas Ignorados pelo Mercado',
    oque:'Direcionar recursos para necessidades não atendidas pelo mercado mainstream.',
    brilha:'Paixão genuína da liderança; competição baixa; inovações que migram para mercados maiores; reputação de pioneirismo.',
    sombra:'Alto risco de falha; pressão por resultado desvia recursos; difícil justificar a investidores; "missão" mascara ineficiência.',
    tensao:'Propósito elevado vs. viabilidade econômica.',
    y:-3, r:[ 2, 6,-3, 5, 4, 2], ty:4, tr:3, sens:['P&D','inovação','liderança'] },
  '1.4': { nome:'Proteção de Posição via Regulatório e Jurídico',
    oque:'Usar patentes, lobby, extensões de registro e barreiras legais para manter vantagem e preços.',
    brilha:'Inovação cara e imitação fácil; proteger investimento em P&D; mercados já pesadamente regulados.',
    sombra:'Reputação negativa; vulnerável a mudanças políticas; lobby distrai do core; "evergreening" atrai reguladores.',
    tensao:'Proteger investimento vs. acesso e reputação.',
    y: 7, r:[-3,-3, 1,-2,-4,-2], ty:1, tr:5, sens:['jurídico','regulatório','liderança'] },
  '1.5': { nome:'Parceria Estratégica com Sistemas Públicos',
    oque:'Relações profundas com sistemas públicos para distribuição, co-desenvolvimento ou fornecimento.',
    brilha:'Sistema público é o maior comprador; escala pública é necessária; credibilidade institucional agrega valor.',
    sombra:'Dependência de orçamento público volátil; burocracia paralisa; percepção de "privatização disfarçada".',
    tensao:'Escala e estabilidade vs. agilidade e autonomia.',
    y: 4, r:[ 2, 3,-1,-1,-2, 4], ty:3, tr:4, sens:['comercial','institucional','operações'] },
  '1.6': { nome:'Educação do Mercado e Construção de Demanda',
    oque:'Informar prescritores, influenciadores e usuários — expandindo o mercado, não só disputando share.',
    brilha:'Categorias novas ou pouco compreendidas; solução superior mas desconhecida; quem educou tem posição.',
    sombra:'Confundido com demanda artificial; alto investimento e retorno incerto; educa o mercado para concorrentes.',
    tensao:'Expandir mercado genuinamente vs. manipular demanda.',
    y: 3, r:[ 1, 3,-2, 3, 2, 3], ty:3, tr:4, sens:['marketing','comercial','cliente'] },

  /* ---------- BLOCO 2 — PESSOAS E ENTRADA ---------- */
  '2.1': { nome:'Seleção por Aderência Cultural Profunda',
    oque:'Priorizar candidatos que "encaixam" na cultura existente.',
    brilha:'Alto contato onde consistência é crítica; cultura como diferencial; momentos de consolidação; integração rápida.',
    sombra:'Reforça viés de classe; filtra quem pensa diferente; "cultura" vira desculpa; bolha ideológica.',
    tensao:'Coesão e velocidade vs. diversidade e renovação.',
    y: 3, r:[ 4, 2, 1,-1,-5, 5], ty:1, tr:3, sens:['RH','gestão','equipe'] },
  '2.2': { nome:'Seleção por Competência Demonstrada',
    oque:'Processos estruturados e testes — foco no que a pessoa sabe fazer, independente de origem.',
    brilha:'Funções técnicas com erro caro; diversidade de background valorizada; reduzir viés de gosto pessoal; escalada rápida.',
    sombra:'Impessoal e desmotivador; processo pesado afasta top; "competência" enviesada; ignora potencial.',

  'pequeno': { '4.2':{pos:1.2}, '4.5':{y:0.8}, '3.5':{neg:1.3}, '6.3':{y:0.7} },
  'medio':   { },
  'grande':  { '4.1':{y:1.2}, '3.3':{y:1.2, neg:1.2}, '4.4':{pos:0.85}, '6.1':{y:1.2} }
};

/* ===== MOTOR ===== */
/* ==========================================================================
   MOTOR — sistema dinâmico de estoques/fluxos + Monte Carlo
   --------------------------------------------------------------------------
   Estado: Y (desempenho, inicia 100) + 6 reservas (iniciam 50, faixa 0..100).
   Passo: 1 ano, de 2026 a 2050.
   Segmentado em 6 trechos, um por marco: 2027, 2030, 2035, 2040, 2045, 2050.

   A novidade do v3 frente ao v2: o motor NÃO roda de ponta a ponta.
   Ele roda TRECHO A TRECHO, e entre um trecho e outro recebe do enxame
   três calibrações medidas (adesão, coerência vivida, nudge por reserva).
   ========================================================================== */

/* --------------------------------------------------------------------------
   A FORMA DO ACOPLAMENTO SUBSTRATO × DESEMPENHO  (decisão em aberto nº1)
   --------------------------------------------------------------------------
   O v2 tratava os estoques como independentes e precisou de um "acoplamento
   mínimo" (dividendo + imposto de fragilidade) colado por fora. Isso deixava
   a organização-máquina drenando o substrato a zero e subindo para sempre.

   O v3 muda a FORMA do laço: o substrato não empurra o desempenho —
   ele define o TETO que o desempenho consegue sustentar.

       Ymeta   = 100 + Σ impulsos das ações        (o que as ações prometem)
       sustenta = f(S)                             (o que o solo aguenta)
       Yeq     = Ymeta × sustenta
       dY      = VEL × (Yeq − Y)                   (o desempenho persegue Yeq)

   Consequência: a máquina ganha as rodadas curtas (Ymeta sobe rápido, o solo
   ainda está em 50) e perde as longas (o solo cede e o teto desaba junto).
   Nada disso é anunciado — emerge da equação.
   -------------------------------------------------------------------------- */
const P = {
  KY:     0.90,    // conversão do impulso da ação em meta de desempenho
  VEL:    0.22,    // velocidade com que o desempenho persegue o equilíbrio
  SUST_A: 0.25,    // sustentação do solo quando S = 0
  SUST_B: 0.015,   // ganho de sustentação por ponto de substrato
  SUST_MIN: 0.12, SUST_MAX: 1.80,
  SCALE:  0.115,   // conversão do impulso da ação em variação anual das reservas
  DECR:   0.016,   // exaustão natural das reservas
  REGEN:  0.035,   // regeneração natural (logística) das reservas
  GANHO_ENCHER: 1.60,  // rendimentos decrescentes ao encher uma reserva
  PISO_ESVAZIAR: 0.25, // o fundo do tanque trava a drenagem
  SIGMA:  0.15,    // dispersão dos impulsos (σ = 0.15·|μ|)
  TETO_FOLGA: 85, DRENO_FOLGA: 0.15,
  TETO_VINC:  85, DRENO_VINC:  0.10,
  LIM_CONF:   30, CASC_VINC: 0.20, CASC_SENT: 0.10,
  SWARM_R:  1.10,  // peso do nudge do enxame sobre cada reserva, por ano
  SWARM_Y:  0.55   // peso da adesão medida sobre o impulso de desempenho
};

const ANO0   = 2026;
const MARCOS = [2027, 2030, 2035, 2040, 2045, 2050];

/* ---------- utilidades estocásticas ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function gauss(rnd){ let u=0,v=0; while(!u)u=rnd(); while(!v)v=rnd();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function poisson(rnd, lambda){ if(lambda<=0) return 0; const L=Math.exp(-lambda); let k=0,p=1;
  do{ k++; p*=rnd(); }while(p>L); return k-1; }
const clamp=(x,a,b)=>{ const n=Number(x); if(!Number.isFinite(n)) return a; return n<a?a:(n>b?b:n); };
const pct=(arr,q)=>{ if(!arr.length) return 0; const s=[...arr].sort((a,b)=>a-b);
  const i=(s.length-1)*q, lo=Math.floor(i), hi=Math.ceil(i);
  return lo===hi? s[lo] : s[lo]+(s[hi]-s[lo])*(i-lo); };

/* ---------- coerência estrutural do conjunto (matriz ação × ação) ---------- */
function coerenciaMatriz(sel){
  if(sel.length<2) return {valor:1.0, tensoes:[], composicoes:[]};
  let soma=0; const tensoes=[], composicoes=[];
  for(let i=0;i<sel.length;i++) for(let j=i+1;j<sel.length;j++){
    const h = COERENCIA[sel[i]+'|'+sel[j]] ?? COERENCIA[sel[j]+'|'+sel[i]] ?? 0;
    if(h===0) continue;
    soma += 2*h; // matriz simétrica: conta o par nos dois sentidos
    (h<0?tensoes:composicoes).push({a:sel[i], b:sel[j], h});
  }
  tensoes.sort((x,y)=>x.h-y.h); composicoes.sort((x,y)=>y.h-x.h);
  return { valor: clamp(1.0 + soma/sel.length, 0.5, 1.25), tensoes, composicoes };
}

/* ---------- vetor de impulso resolvido por contexto ---------- */
function vetorContexto(id, ctx){
  const a = ACOES[id];
  let y = a.y, r = a.r.slice();
  const mods = [ MOD_SETOR[ctx.setor]?.[id], MOD_MOMENTO[ctx.momento]?.[id], MOD_PORTE[ctx.porte]?.[id] ];
  for(const m of mods){
    if(!m) continue;
    if(m.y) y *= m.y;
    for(let j=0;j<6;j++){
      if(r[j]>0 && m.pos) r[j] *= m.pos;
      if(r[j]<0 && m.neg) r[j] *= m.neg;
    }
  }
  return { y, r, ty:a.ty, tr:a.tr };
}

/* ==========================================================================
   Ensemble de Monte Carlo — N trajetórias avançadas em paralelo
   ========================================================================== */
function novoEnsemble(N, seed){
  const rnd = mulberry32(seed>>>0);
  const traj = new Array(N);
  for(let n=0;n<N;n++){
    traj[n] = { Y:100, R:[50,50,50,50,50,50], viva:true, anoQuebra:null,
                choques:[], rnd: mulberry32((seed*2654435761 + n*40503)>>>0) };
  }
  return { N, traj, rnd, hist:[] };
}

/* Sorteia, uma vez por trajetória, os parâmetros incertos de cada ação. */
function sortearParametros(ens, sel, ctx){
  const base = sel.map(id=>vetorContexto(id, ctx));
  for(const t of ens.traj){
    t.acoes = base.map(v=>({
      y:  v.y + gauss(t.rnd)*P.SIGMA*Math.abs(v.y),
      r:  v.r.map(m => m + gauss(t.rnd)*P.SIGMA*Math.abs(m)),
      ty: poisson(t.rnd, v.ty),
      tr: poisson(t.rnd, v.tr)
    }));
  }
}

/* --------------------------------------------------------------------------
   Avança o ensemble do ano `de` até o ano `ate` (inclusive), usando as
   calibrações vindas do enxame para esse trecho.
   cal = { alpha: 0..1.3, coerViva: 0..1, nudge: [6] em -1..1 }
   -------------------------------------------------------------------------- */
function avancar(ens, de, ate, sel, ctx, coMatriz, cal, pshock){
  const fin = (v,d)=>Number.isFinite(Number(v))?Number(v):d;
  const alpha    = cal ? clamp(fin(cal.alpha, 1), 0.25, 1.30) : 1.0;
  const coViva   = cal ? clamp(fin(cal.coerViva, 1), 0, 1)    : 1.0;
  const nudge    = (cal && Array.isArray(cal.nudge)) ? cal.nudge.map(v=>clamp(fin(v,0),-1,1)) : [0,0,0,0,0,0];
  const Co       = clamp(coMatriz * (0.65 + 0.35*coViva), 0.35, 1.30);
  const fatorY   = 1 - P.SWARM_Y + P.SWARM_Y*alpha;

  for(let ano=de; ano<=ate; ano++){
    const dt = ano - ANO0;
    for(const t of ens.traj){
      if(!t.viva) continue;

      /* --- fluxos das ações, com atraso ---
         A coerência é aplicada só ao que CONSTRÓI. O dano não vaza:
         um conjunto contraditório perde a energia que investe, mas continua
         pagando integralmente o preço do que faz. */
      let fY=0, fRp=[0,0,0,0,0,0], fRn=[0,0,0,0,0,0];
      for(const a of t.acoes){
        if(dt >= a.ty) fY += a.y;
        if(dt >= a.tr) for(let j=0;j<6;j++){ if(a.r[j]>=0) fRp[j]+=a.r[j]; else fRn[j]+=a.r[j]; }
      }

      const S = (t.R[0]+t.R[1]+t.R[2]+t.R[3]+t.R[4]+t.R[5])/6;

      // --- desempenho: meta das ações × sustentação do solo ---
      const Ymeta    = 100 + fY*P.KY*Co*fatorY;
      const sustenta = clamp(P.SUST_A + P.SUST_B*S, P.SUST_MIN, P.SUST_MAX);
      let dY = P.VEL*(Ymeta*sustenta - t.Y);
      if(t.R[2]>P.TETO_FOLGA) dY -= P.DRENO_FOLGA*(t.R[2]-P.TETO_FOLGA); // folga em excesso = ineficiência

      // --- reservas, com rendimentos decrescentes ---
      const dR=[0,0,0,0,0,0];
      for(let j=0;j<6;j++){
        const Rj = t.R[j];
        const enche = fRp[j]*P.SCALE*Co * P.GANHO_ENCHER*(1-Rj/100);       // encher custa cada vez mais
        const drena = fRn[j]*P.SCALE     * (P.PISO_ESVAZIAR + (1-P.PISO_ESVAZIAR)*Rj/100); // não se drena o que não há
        dR[j] = enche + drena
              + P.REGEN*Rj*(1-Rj/100)
              - P.DECR*Rj
              + nudge[j]*P.SWARM_R;
      }
      if(t.R[5]>P.TETO_VINC) dR[4] -= P.DRENO_VINC*(t.R[5]-P.TETO_VINC);   // panelinha trava plasticidade
      if(t.R[0]<P.LIM_CONF){                                                // cascata da desconfiança
        dR[5] -= P.CASC_VINC*(P.LIM_CONF-t.R[0]);
        dR[1] -= P.CASC_SENT*(P.LIM_CONF-t.R[0]);
      }

      // --- choque endógeno ---
      const pAno = clamp(pshock * (1 + (50-S)/50*0.9), 0.02, 0.42);
      if(t.rnd() < pAno){
        const I = 20 + t.rnd()*30;
        let desfecho;
        if(S < 35){ dY -= I; for(let j=0;j<6;j++) dR[j] -= 0.5*I; desfecho='quebra'; }
        else if(S <= 70){ dY -= I*(1-0.01*S); for(let j=0;j<6;j++) dR[j] -= 5.0; desfecho='aguenta'; }
        else { dY += 0.2*I; for(let j=0;j<6;j++) dR[j] += 2.0; desfecho='fortalece'; }
        t.choques.push({ano, I, S, desfecho});
      }

      t.Y += dY;
      for(let j=0;j<6;j++) t.R[j] = clamp(t.R[j]+dR[j], 0, 100);
      if(t.Y <= 0){ t.viva=false; t.anoQuebra=ano; t.Y=0; }
    }
  }
}

/* --------------------------------------------------------------------------
   Fotografia do ensemble num marco.
   -------------------------------------------------------------------------- */
function foto(ens, ano, anterior){
  const vivas = ens.traj.filter(t=>t.viva);
  const Ys = vivas.map(t=>t.Y);
  const Ss = vivas.map(t=>(t.R[0]+t.R[1]+t.R[2]+t.R[3]+t.R[4]+t.R[5])/6);
  const R  = RESERVAS.map((_,j)=>{
    const v = vivas.map(t=>t.R[j]);
    return { p10:pct(v,0.10), p50:pct(v,0.50), p90:pct(v,0.90) };
  });
  const quebradas = ens.traj.filter(t=>!t.viva);
  const choques = ens.traj.flatMap(t=>t.choques.filter(c=>c.ano<=ano));
  const cont = {quebra:0, aguenta:0, fortalece:0};
  choques.forEach(c=>cont[c.desfecho]++);

  const f = {
    ano,
    Y:  { p10:pct(Ys,0.10), p50:pct(Ys,0.50), p90:pct(Ys,0.90) },
    S:  { p10:pct(Ss,0.10), p50:pct(Ss,0.50), p90:pct(Ss,0.90) },
    R,
    taxaQuebra: quebradas.length/ens.N,
    anoQuebraMedio: quebradas.length ? quebradas.reduce((s,t)=>s+t.anoQuebra,0)/quebradas.length : null,
    choquesPorTraj: choques.length/ens.N,
    desfechos: cont,
    frequencia: null, dY:null, dS:null
  };

  if(anterior){
    const gap = Math.max(1, ano - anterior.ano);
    f.dY = (f.Y.p50 - anterior.Y.p50)/gap;   // por ano
    f.dS = (f.S.p50 - anterior.S.p50)/gap;
    const eps = 0.15;
    if(f.dY >= -eps && f.dS >= -eps)      f.frequencia = 'humana';
    else if(f.dY > eps && f.dS < -eps)    f.frequencia = 'maquina';
    else if(f.dY < -eps && f.dS < -eps)   f.frequencia = 'sintomas';
    else                                   f.frequencia = 'transicao';
  }
  return f;
}

/* --------------------------------------------------------------------------
   API de alto nível: cria a corrida e devolve um objeto que avança por marco.
   -------------------------------------------------------------------------- */
function criarCorrida(sel, ctx, N=3000, seed=20260724){
  const ens = novoEnsemble(N, seed);
  sortearParametros(ens, sel, ctx);
  const co  = coerenciaMatriz(sel);
  const ps  = (SETORES[ctx.setor]?.pshock ?? 0.11);
  const fotos = [];
  let idx = 0, cursor = ANO0;

  return {
    ensemble: ens,
    coerencia: co,
    fotos,
    /* estado mediano corrente — é o que o enxame enxerga antes de agir */
    estadoAtual(){
      const vivas = ens.traj.filter(t=>t.viva);
      if(!vivas.length) return {Y:0, R:[0,0,0,0,0,0], S:0};
      const Y = pct(vivas.map(t=>t.Y),0.5);
      const R = RESERVAS.map((_,j)=>pct(vivas.map(t=>t.R[j]),0.5));
      return {Y, R, S:R.reduce((a,b)=>a+b,0)/6};
    },
    marcoAtual(){ return MARCOS[idx]; },
    terminou(){ return idx >= MARCOS.length; },
    /* avança até o próximo marco usando a calibração do enxame */
    passo(cal){
      const ate = MARCOS[idx];
      avancar(ens, cursor+1, ate, sel, ctx, co.valor, cal, ps);
      cursor = ate;
      const f = foto(ens, ate, fotos[fotos.length-1]);
      f.calibracao = cal || null;
      fotos.push(f); idx++;
      return f;
    }
  };
}

function limparChave(k){

}

const ehGpt5 = m => !!m && m.trim().toLowerCase().startsWith('gpt-5');

/* Emula o raw_decode do Python: decodifica só o primeiro objeto JSON. */
function decodePrimeiroObjeto(txt){
  const ini = txt.search(/[{[]/); if(ini<0) throw new SyntaxError('sem JSON');
  let d=0, str=false, esc=false;
  for(let i=ini;i<txt.length;i++){
    const c = txt[i];
    if(esc){ esc=false; continue; }
    if(c==='\\' && str){ esc=true; continue; }
    if(c==='"'){ str=!str; continue; }
    if(str) continue;
    if(c==='{'||c==='[') d++;
    else if(c==='}'||c===']'){ d--; if(d===0) return {valor:JSON.parse(txt.slice(ini,i+1)), fim:i+1}; }
  }
  throw new SyntaxError('JSON incompleto');
}
const limpar = s => s.replace(/<think>[\s\S]*?<\/think>/g,'').trim()
  .replace(/^﻿/,'').replace(/^```(?:json)?\s*\n?/i,'').replace(/\n?```\s*$/,'').trim();

function extrairTexto(resp){
  const m = resp?.choices?.[0]?.message; if(!m) return '';
  const c = m.content;
  if(typeof c === 'string') return c;
  if(Array.isArray(c)) return c.map(i =>
    typeof i?.text==='string' ? i.text :
    typeof i?.text?.value==='string' ? i.text.value :
    typeof i?.content==='string' ? i.content : '').join('').trim();
  return String(c ?? '');
}

function formatoNaoSuportado(err){
  if(![400,422].includes(err?.status)) return false;
  const d = err.body?.error ?? err.body; if(!d || typeof d!=='object') return false;
  const param = String(d.param ?? '').toLowerCase();
  if(param==='response_format' || param.startsWith('response_format.')) return true;
  const msg = String(d.message ?? '').toLowerCase();
  if(!msg.includes('response_format')) return false;
  const code = String(d.code ?? '').toLowerCase();
  return ['unsupported_parameter','unsupported_value','unknown_parameter','invalid_parameter'].includes(code)
      || ['not support','unsupported','unknown parameter','unrecognized parameter'].some(p=>msg.includes(p));
}

let CHAMADAS = 0, TOKENS_EST = 0;

async function chamar({messages, temperature=0.7, maxTokens=null, responseFormat=null, timeoutMs=180000}){
  const body = { model: API.model, messages };
  if(responseFormat) body.response_format = responseFormat;
  const g5 = ehGpt5(API.model);
  if(temperature!=null && !g5) body.temperature = temperature;
  if(maxTokens!=null) body[g5?'max_completion_tokens':'max_tokens'] = maxTokens;

  const ctrl = new AbortController();
  const to = setTimeout(()=>ctrl.abort(), timeoutMs);
  let r;
  try{
    r = await fetch(API.baseUrl.replace(/\/$/,'') + '/chat/completions', {
      method:'POST', signal:ctrl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+limparChave(API.apiKey)},
      body: JSON.stringify(body)
    });
  }catch(e){
    clearTimeout(to);
    const err = new Error(e.name==='AbortError' ? 'tempo esgotado'
      : 'CORS: o provedor respondeu, mas o navegador não deixou a página ler a resposta. Suba o gzero-proxy.mjs e use http://localhost:8787 como Base URL.');
    err.rede = true; err.cors = (e.name!=='AbortError'); throw err;
  }
  let json = null;
  try{ json = await r.json(); }catch(_){ json = null; }
  finally{ clearTimeout(to); }
  if(!r.ok){
    const e = new Error(json?.error?.message || r.statusText);
    e.status = r.status; e.body = json; throw e;
  }
  CHAMADAS++;
  TOKENS_EST += (json?.usage?.total_tokens ?? 0);
  return json;
}

/* Duas negociações separadas, como no MiroFish: capacidade (response_format)
   não consome tentativa de conteúdo. Backoff exponencial com jitter. */
async function chatJson(messages, {temperature=0.4, maxTokens=null, tentativas=2, retries=2}={}){
  let formato = {type:'json_object'}, teto = maxTokens, ultimo;
  for(let t=1;t<=tentativas;t++){
    let resp, atraso = 1200;
    for(let k=0;k<=retries;k++){
      try{
        resp = await chamar({messages, temperature, maxTokens:teto, responseFormat:formato});
        break;
      }catch(e){
        if(formato && formatoNaoSuportado(e)){ formato = null; log('provedor recusou response_format — seguindo sem ele','w'); k--; continue; }
        if(k===retries) throw e;
        if(e.status && e.status<500 && e.status!==429 && !e.rede) throw e;
        await dormir(atraso*(0.5+Math.random())); atraso*=2;
      }
    }
    const ch = resp?.choices?.[0];
    if(!ch){ ultimo = new Error('resposta sem choices'); }
    else if(ch.finish_reason==='length'){ ultimo = new Error('JSON truncado no limite de tokens'); }
    else{
      const txt = limpar(extrairTexto(resp));
      if(!txt) ultimo = new Error('resposta JSON vazia');
      else{
        try{
          const v = JSON.parse(txt);
          if(v && typeof v==='object' && !Array.isArray(v)) return v;
          ultimo = new Error('JSON precisa ser um objeto no topo');
        }catch(_){
          try{
            const {valor, fim} = decodePrimeiroObjeto(txt);
            const resto = txt.slice(fim).trim();
            if(resto && /^\s*[{[]/.test(resto)) ultimo = new Error('mais de um JSON na resposta');
            else if(resto) { log('havia texto depois do JSON — ignorado','w');
              if(valor && typeof valor==='object' && !Array.isArray(valor)) return valor; }
            else if(valor && typeof valor==='object' && !Array.isArray(valor)) return valor;
            else ultimo = new Error('JSON precisa ser um objeto no topo');
          }catch(e2){ ultimo = e2; }
        }
      }
    }
    if(t>=tentativas) throw ultimo;
    teto = null;  // tira o teto de tokens na retentativa — causa comum de JSON parcial
  }
  throw ultimo;
}

async function chatTexto(messages, {temperature=0.7, maxTokens=1600}={}){
  const r = await chamar({messages, temperature, maxTokens});
  return limpar(extrairTexto(r));
}

/* Executa promessas com teto de concorrência (o backend do MiroFish faz
   sequencial; no navegador dá para paralelizar — os itens são independentes). */
async function emLotes(itens, fn, limite=5, aoTerminar=null){
  const out = new Array(itens.length);
  let i = 0;
  const worker = async () => {
    while(true){
      const k = i++; if(k>=itens.length) return;
      try{ out[k] = await fn(itens[k], k); }
      catch(e){ out[k] = {__erro: e.message||String(e)}; }
      if(aoTerminar) aoTerminar(out[k], k, itens.length);
    }
  };
  await Promise.all(Array.from({length:Math.min(limite,itens.length)}, worker));
  return out;
}

/* ==========================================================================
   ENXAME — a transposição do MiroFish para o corpo de uma organização
   --------------------------------------------------------------------------
   MiroFish                              →  Calculadora v3
   documento-semente                     →  contexto da organização + ações
   ontologia de 10 tipos de entidade     →  ontologia de 10 papéis do corpo
   persona OASIS (bio + persona 2000ch)  →  persona organizacional
   agent_configs (activity/hours/stance) →  reatividade / influência / janela
   rodada = 1 hora de ciclo de notícia   →  rodada = 1 MARCO (2027..2050)
   feed = 2-5 posts do recsys            →  o que chegou até essa pessoa
   ação = post/like/repost               →  postura diante da decisão
   trace → actions.jsonl enriquecido     →  falas + efeito declarado
   ReportAgent (ReAct + 4 ferramentas)   →  síntese por marco + relatório
   entrevista pós-simulação              →  entrevistar o corpo
   ========================================================================== */

const POSTURAS = {
  adere:              {rot:'ADERE',            desc:'compra a decisão e a leva adiante'},
  cumpre_sem_crer:    {rot:'CUMPRE SEM CRER',  desc:'faz o combinado sem colocar nada de si'},
  resiste:            {rot:'RESISTE',          desc:'atrita abertamente'},
  reinterpreta:       {rot:'REINTERPRETA',     desc:'faz à sua maneira, salvando o que importa'},
  propoe_alternativa: {rot:'PROPÕE OUTRA VIA', desc:'oferece um caminho diferente'},
  sai:                {rot:'SAI',              desc:'vai embora ou se desliga por dentro'},
  silencia:           {rot:'SILENCIA',         desc:'some do debate; deixa de dizer o que via'}
};

/* Peso de cada postura sobre a adesão real (o que de fato é implementado). */
const PESO_ADESAO = { adere:1.15, reinterpreta:0.90, propoe_alternativa:0.75,
  cumpre_sem_crer:0.55, silencia:0.45, resiste:0.30, sai:0.20 };

/* Leitura numérica à prova de NaN: o operador ?? não pega Number("alto") = NaN,
   e um único NaN vindo de um agente contamina o motor inteiro e nunca mais sai. */
function num01(v, padrao, min=0, max=1){
  const n = Number(v);
  return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : padrao;
}

const IDIOMA = 'Responda SEMPRE em português do Brasil, em linguagem natural e concreta, sem jargão de consultoria.';

/* --------------------------------------------------------------------------
   1) ONTOLOGIA DO CORPO
   Espelha o OntologyGenerator: o LLM projeta 8 papéis específicos do contexto
   + 2 papéis-coringa obrigatórios (o MiroFish força Person e Organization

  const sys = `Você é especialista em desenho organizacional. Sua tarefa é mapear QUEM é o corpo vivo de uma organização — os papéis que sentem, na pele, as decisões que ela toma.
Você devolve SEMPRE um objeto JSON válido, e nada além dele.
${IDIOMA}`;
  const usr = `## A organização
Nome: ${ctx.nome}

Porte: ${PORTES[ctx.porte].nome}
Momento: ${MOMENTOS[ctx.momento].nome}

Projete EXATAMENTE 10 papéis que compõem o corpo dessa organização.

Regras inegociáveis:

   PODE ser: cargos e funções reais (analista de X, gerente de Y, pessoa da ponta, técnico, liderança, fornecedor, cliente interno).
   NÃO PODE ser: conceitos abstratos ("a cultura", "o clima", "a inovação"), áreas sem gente ("o financeiro" sozinho) nem posições ("os favoráveis").
2. Os 8 PRIMEIROS são específicos DESTE setor, deste porte e DESTAS decisões — nomes que só fariam sentido aqui.
3. Os 2 ÚLTIMOS são coringas obrigatórios, exatamente nesta ordem:
   - "Pessoa da ponta" — quem executa e quase nunca é consultado
   - "Área de apoio" — quem sustenta a operação por trás e sente o efeito de lado
4. A soma dos campos "peso" deve dar aproximadamente 100.

Formato do JSON:
{
  "leitura": "1 a 2 frases sobre o que esse conjunto de decisões pede desse corpo",
  "papeis": [
    {
      "papel": "nome do papel",
      "descricao": "o que essa pessoa faz no dia a dia, 1 frase concreta",

Onde:
- "peso": quantas pessoas desse papel existem, proporcionalmente (0 a 100).
- "poder": quanto a voz desse papel pesa na organização, de 0.5 (quase nenhuma) a 3.0 (define o rumo).

- "reserva_ancora": a reserva humana que esse papel mais carrega. Escolha uma de:
  confianca, sentido, folga, autoria, plasticidade, vinculo`;

  const r = await chatJson([{role:'system',content:sys},{role:'user',content:usr}],

  let papeis = Array.isArray(r.papeis) ? r.papeis : [];
  papeis = papeis.filter(p=>p && typeof p.papel==='string' && p.papel.trim()).slice(0,10);
  // rede de segurança: os coringas são garantidos em código, não confiados ao LLM
  const temPonta = papeis.some(p=>/ponta/i.test(p.papel));
  const temApoio = papeis.some(p=>/apoio/i.test(p.papel));
  if(!temPonta) papeis.push({papel:'Pessoa da ponta', descricao:'executa o combinado e quase nunca é consultada',

  if(!temApoio) papeis.push({papel:'Área de apoio', descricao:'sustenta a operação por trás e sente o efeito de lado',

  papeis = papeis.slice(0,10);

  const idsValidos = new Set(sel);
  papeis.forEach(p=>{

    p.poder = Math.min(3, Math.max(0.4, Number(p.poder) || 1));

/* --------------------------------------------------------------------------
   3) ATIVAÇÃO ESPARSA — o padrão de 3 estágios do MiroFish, transposto.
   (i) orçamento do marco, (ii) janela de exposição, (iii) moeda de reatividade,
   (iv) amostra uniforme truncada. Ninguém age em todo marco.
   -------------------------------------------------------------------------- */
const PRESSAO_MARCO = {2027:0.60, 2030:0.80, 2035:0.90, 2040:0.85, 2045:0.80, 2050:0.75};

function ativar(agentes, marco, estado, rnd=Math.random){
  const S = estado.S ?? 50;
  const tensao = 1 + Math.max(0, (50-S))/50 * 0.45;          // solo baixo mexe mais gente
  const alvo = Math.max(3, Math.round(agentes.length * PRESSAO_MARCO[marco] * tensao));
  const candidatos = agentes.filter(a => !a.saiu && rnd() < a.reatividade);
  if(!candidatos.length){ const vivos = agentes.filter(a=>!a.saiu); const base = vivos.length?vivos:agentes; return base.slice(0, Math.min(3, base.length)); }
  // amostra sem reposição, enviesada por poder (quem tem mais voz aparece mais)
  const pool = candidatos.slice();
  const out = [];
  const n = Math.min(alvo, pool.length);
  while(out.length < n && pool.length){
    let soma = pool.reduce((s,a)=>s + (0.5 + a.poder), 0);
    let r = rnd()*soma, k = 0;
    for(; k<pool.length; k++){ r -= (0.5 + pool[k].poder); if(r<=0) break; }
    out.push(pool.splice(Math.min(k, pool.length-1),1)[0]);
  }
  return out;
}

/* --------------------------------------------------------------------------
   4) O FEED — o análogo do recsys do MiroFish, em duas etapas:
   ranquear (por poder × diversidade de postura) e ENTREGAR uma amostra pequena.
   O feed que chega ao LLM é minúsculo de propósito: é o filtro que gera
   emergência, não o volume.
   -------------------------------------------------------------------------- */
function montarFeed(agente, rodadaAnterior, marco, estado, delta){
  const linhas = [];
  linhas.push(`Ano: ${marco}.`);
  const rot = ['Confiança','Sentido','Folga','Autoria','Plasticidade','Vínculo'];
  linhas.push('Como está o solo humano da organização hoje (0 a 100, começou em 50):');
  estado.R.forEach((v,j)=>{
    const d = delta ? delta[j] : 0;
    const seta = d> 1.5?'subindo': d<-1.5?'caindo':'estável';
    linhas.push(`  ${rot[j]}: ${v.toFixed(0)} (${seta})`);
  });
  const dY = delta ? delta[6] : 0;
  linhas.push(`Desempenho visível: ${estado.Y.toFixed(0)} (base 100 em 2026, ${dY>1?'subindo':dY<-1?'caindo':'estável'}).`);
  if(estado.R[RESERVAS.findIndex(r=>r.id===agente.ancora)] < 30)
    linhas.push(`ATENÇÃO: aquilo que você mais carrega (${agente.ancora}) está em nível crítico.`);

  if(agente.memoria.length){
    linhas.push('\nO que você mesmo fez nos marcos anteriores:');
    agente.memoria.slice(-2).forEach(m=>linhas.push(`  ${m.ano}: você ${POSTURAS[m.postura]?.rot.toLowerCase()||m.postura} — "${m.fala}"`));
  }

  if(rodadaAnterior && rodadaAnterior.length){
    // ranquear por poder, com bônus para posturas diferentes da última do agente
    const minha = agente.memoria.length ? agente.memoria[agente.memoria.length-1].postura : null;
    const rank = rodadaAnterior.slice().sort((a,b)=>{
      const sa = a.poder + (a.postura!==minha?0.8:0), sb = b.poder + (b.postura!==minha?0.8:0);
      return sb-sa;
    }).slice(0, Math.min(6, rodadaAnterior.length));
    // entrega: amostra aleatória de 3 do topo (ruído deliberado, como no refresh do MiroFish)
    const amostra = rank.sort(()=>Math.random()-0.5).slice(0,3);
    if(amostra.length){
      linhas.push('\nO que você ouviu circulando pela organização:');
      amostra.forEach(f=>linhas.push(`  ${f.nome} (${f.cargo}): "${f.fala}"`));
    }
  }
  return linhas.join('\n');
}

  const usr = `As decisões que mais te atingem:

## O que você faz agora

Formato do JSON:
{
  "postura": "adere | cumpre_sem_crer | resiste | reinterpreta | propoe_alternativa | sai | silencia",
  "acao_gatilho": "o ID da decisão que mais pesou (ex.: 3.1)",

Onde:

- "contradicao_percebida": de 0 (as decisões conversam entre si) a 1 (a organização diz uma coisa e faz outra).
- "efeito": de -3 a +3, o que ESSA SUA POSTURA faz com cada reserva humana ao seu redor — não o que você gostaria, o que de fato acontece.`;

    fala: String(r.fala||'').slice(0,420),

/* --------------------------------------------------------------------------
   6) AGREGAÇÃO — o enxame vira três calibrações que entram no motor.
   Este é o acoplamento híbrido: o enxame MEDE o que a tabela de parâmetros
   só consegue chutar.
   -------------------------------------------------------------------------- */
function calibrar(falas){
  if(!falas.length) return {alpha:1, coerViva:1, nudge:[0,0,0,0,0,0], contradicao:0, posturas:{}, n:0};
  const W = falas.reduce((s,f)=>s+f.poder, 0) || 1;
  const alpha = falas.reduce((s,f)=>s + f.poder * f.implementa * (PESO_ADESAO[f.postura]||0.6), 0)/W;
  const contr = falas.reduce((s,f)=>s + f.poder * f.contradicao, 0)/W;
  const nudge = RESERVAS.map((_,j)=> falas.reduce((s,f)=>s + f.poder * f.efeito[j], 0)/W/3);
  const cont = {}; Object.keys(POSTURAS).forEach(k=>cont[k]=0);
  falas.forEach(f=>cont[f.postura]++);
  return { alpha: Math.min(1.3, Math.max(0.25, alpha)), coerViva: 1-contr,
           nudge, contradicao: contr, n: falas.length, posturas: cont };
}

/* --------------------------------------------------------------------------
   7) SÍNTESE NARRATIVA DO MARCO — a camada narrativa.
   Herda do ReportAgent a regra dura: só pode citar o que apareceu de fato.
   -------------------------------------------------------------------------- */
async function narrarMarco(marco, foto, falas, cal, ctx, anterior){
  const rot = RESERVAS.map(r=>r.nome);
  const estado = foto.R.map((r,j)=>`${rot[j]} ${r.p50.toFixed(0)}`).join(', ');
  const vozes = falas.slice(0,10).map(f=>`- ${f.nome} (${f.cargo}) — ${POSTURAS[f.postura].rot}: "${f.fala}"`).join('\n');
  const freq = {humana:'o desempenho sobe junto com o solo humano', maquina:'o desempenho sobe enquanto o solo humano desce',
    sintomas:'os dois caem', transicao:'movimento misto'}[foto.frequencia] || 'primeiro retrato';
  const d = foto.desfechos, tot = (d.quebra+d.aguenta+d.fortalece)||1;

  const sys = `Você escreve o retrato de um ano futuro de uma organização, a partir de duas fontes: a conta do motor de simulação e as falas do corpo simulado.

REGRAS INEGOCIÁVEIS
1. Só use o que está nos dados abaixo. Não invente número, nome, fala nem evento.

5. Se houver descompasso entre a conta visível e o que o corpo diz, é ISSO que você conta.
${IDIOMA}`;

  const usr = `## ${ctx.nome} — ano ${marco}

${vozes}

Escreva o retrato de ${marco}.`;

  return await chatTexto([{role:'system',content:sys},{role:'user',content:usr}], {temperature:0.7, maxTokens:900});
}

/* --------------------------------------------------------------------------
   8) RELATÓRIO FINAL
   -------------------------------------------------------------------------- */
async function relatorioFinal(fotos, ctx, sel, co, historico){
  const linha = fotos.map(f=>`${f.ano}: desempenho ${f.Y.p50.toFixed(0)} [${f.Y.p10.toFixed(0)}–${f.Y.p90.toFixed(0)}], solo ${f.S.p50.toFixed(0)}, quebra acumulada ${(f.taxaQuebra*100).toFixed(1)}%, direção ${f.frequencia||'—'}`).join('\n');
  const escolhas = sel.map(id=>`${id} ${ACOES[id].nome}`).join('; ');
  const tens = co.tensoes.slice(0,4).map(t=>`${t.a}×${t.b} (${t.h})`).join(', ') || 'nenhuma relevante';
  const comps = co.composicoes.slice(0,4).map(t=>`${t.a}×${t.b} (+${t.h})`).join(', ') || 'nenhuma relevante';
  const vozes = historico.flat().sort((a,b)=>b.poder-a.poder).slice(0,14)
    .map(f=>`- ${f.ano} · ${f.nome} (${f.cargo}) — ${POSTURAS[f.postura].rot}: "${f.fala}"`).join('\n');
  const ult = fotos[fotos.length-1];

  const sys = `Você escreve o fechamento de um exercício de futuros. Não é consultoria, não é sermão, não é resumo executivo. É um relato honesto do que essas escolhas produziram ao longo de 24 anos.

REGRAS
1. Só use o que está nos dados. Nada de inventar.
2. Cite ao menos três falas literais com o nome de quem falou.
3. Não recomende ações. Descreva a conta.
4. Termine com UMA frase — não uma nota, não um número — que sintetize o que foi trocado por quê. Exemplo de forma (não de conteúdo): "o vínculo foi trocado por escala".
5. Texto corrido, 4 a 6 parágrafos. Sem markdown de estrutura.
${IDIOMA}`;
  const usr = `## ${ctx.nome} — ${SETORES[ctx.setor].nome}, ${PORTES[ctx.porte].nome}, ${MOMENTOS[ctx.momento].nome}

Escolhas: ${escolhas}
Coerência estrutural do conjunto: ${co.valor.toFixed(2)} (1.00 = sem tensão interna)
Tensões: ${tens}
Composições: ${comps}

Trajetória:
${linha}

Situação em 2050: reservas ${ult.R.map((r,j)=>RESERVAS[j].nome+' '+r.p50.toFixed(0)).join(', ')}.

Vozes do corpo ao longo do tempo:
${vozes}

Escreva o fechamento.`;
  return await chatTexto([{role:'system',content:sys},{role:'user',content:usr}], {temperature:0.7, maxTokens:2000});
}

/* --------------------------------------------------------------------------
   9) ENTREVISTA — sonda não-invasiva, como no MiroFish: lê a memória do
   agente e NÃO escreve a resposta de volta nela.
   -------------------------------------------------------------------------- */
async function entrevistar(agente, pergunta, historicoChat, ctx, fotos){
  const trilha = agente.memoria.map(m=>`  ${m.ano}: ${POSTURAS[m.postura]?.rot} — "${m.fala}"`).join('\n') || '  (você atravessou esses anos sem se manifestar)';
  const fim = fotos[fotos.length-1];
  const sys = `Você É ${agente.nome}, ${agente.cargo} em ${ctx.nome}. Estamos em 2050, olhando para trás. Responda em primeira pessoa, na sua linguagem, sem virar consultor e sem resumir a empresa — conte a sua parte.

QUEM VOCÊ É
${agente.historia}

O QUE VOCÊ FEZ AO LONGO DESSES ANOS
${trilha}

COMO A EMPRESA TERMINOU
Desempenho ${fim.Y.p50.toFixed(0)} (era 100 em 2026). Reservas humanas: ${fim.R.map((r,j)=>RESERVAS[j].nome+' '+r.p50.toFixed(0)).join(', ')}.

Responda em 2 a 5 frases. Texto puro, sem markdown.
${IDIOMA}`;
  const msgs = [{role:'system',content:sys}];
  historicoChat.slice(0,-1).slice(-6).forEach(m=>msgs.push({role:m.role, content:m.content}));
  msgs.push({role:'user',content:pergunta});
  return await chatTexto(msgs, {temperature:0.85, maxTokens:600});
}

async function perguntarAoRelator(pergunta, historicoChat, relatorio, ctx, fotos, historico){
  const vozes = historico.flat().sort(()=>Math.random()-0.5).slice(0,20)
    .map(f=>`${f.ano} · ${f.nome} (${f.cargo}) — ${POSTURAS[f.postura].rot}: "${f.fala}"`).join('\n');
  const linha = fotos.map(f=>`${f.ano}: Y ${f.Y.p50.toFixed(0)} [${f.Y.p10.toFixed(0)}–${f.Y.p90.toFixed(0)}], solo ${f.S.p50.toFixed(0)}, quebra ${(f.taxaQuebra*100).toFixed(1)}%, ${f.frequencia||'—'}`).join('\n');
  const sys = `Você responde perguntas sobre uma simulação de futuros já concluída. Seja direto e curto. Só afirme o que está nos dados abaixo; se não estiver, diga que a simulação não mostra isso.
${IDIOMA}

RELATÓRIO
${relatorio}

TRAJETÓRIA
${linha}

AMOSTRA DE FALAS DO CORPO
${vozes}`;
  const msgs = [{role:'system',content:sys}];
  historicoChat.slice(0,-1).slice(-8).forEach(m=>msgs.push({role:m.role, content:m.content}));
  msgs.push({role:'user',content:pergunta});
  return await chatTexto(msgs, {temperature:0.5, maxTokens:800});
}

/* ---------- terminal ---------- */
let ultimoLog = '';
function log(msg, tipo=''){
  const t = new Date().toLocaleTimeString('pt-BR',{hour12:false});
  const chave = tipo+'|'+msg;
  if(chave === ultimoLog) return;          // dedupe por chave composta (padrão MiroFish)
  ultimoLog = chave;
  const el = $('#term');
  const div = document.createElement('div');
  div.innerHTML = `<span class="t">${t}</span><span class="${tipo}">${esc(msg)}</span>`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function chips(){

    `<div class="step-chip ${i<E.etapa?'done':i===E.etapa?'active':''}">${i+1} ${n}</div>`).join('');
}

      deste setor e destas decisões, mais dois coringas obrigatórios. Depois gera uma
      <b>pessoa concreta</b> para cada vaga. Os cartões vão aparecendo conforme nascem.</p>
      <div class="prog"><i id="pbar" style="width:0%"></i></div>
      <div class="mono small muted" id="pmsg">aguardando…</div>
      <div class="hr"></div>
      <div class="personas" id="corpoWrap"></div>
      <div id="corpoFim" style="margin-top:20px"></div>`;

async function iniciarCorpo(){
  renderCorpo();
  E.agentes = []; E.ontologia = null;
  const setBar = (p,m)=>{ if($('#pbar')) $('#pbar').style.width = p+'%'; if($('#pmsg')) $('#pmsg').textContent = m; };
  try{
    setBar(4,'projetando a ontologia dos papéis…');
    log('gerando ontologia do corpo organizacional');
    E.ontologia = await gerarOntologia(E.ctx, E.sel);
    log('ontologia pronta: '+E.ontologia.papeis.length+' papéis');
    renderOntologia();

    // distribui as vagas entre os papéis, proporcional ao peso
    const total = E.ontologia.papeis.reduce((s,p)=>s+p.peso,0);
    const vagas = [];
    E.ontologia.papeis.forEach(p=>{
      const q = Math.max(1, Math.round(E.nAgentes * p.peso/total));
      for(let i=0;i<q;i++) vagas.push(p);
    });
    while(vagas.length > E.nAgentes) vagas.pop();
    while(vagas.length < E.nAgentes) vagas.push(E.ontologia.papeis[vagas.length % E.ontologia.papeis.length]);

    setBar(10, `0 de ${vagas.length} pessoas`);   // o denominador antes do numerador
    let feitos = 0, falhasPersona = 0;
    const res = await emLotes(vagas, (p,i)=>gerarPersona(p,i,E.ctx,E.sel), 5, (out)=>{
      feitos++;
      setBar(10 + 88*feitos/vagas.length, `${feitos} de ${vagas.length} pessoas`);
      if(out && !out.__erro){ E.agentes.push(out); addCartaoPersona(out); }
      else log(`falha ao gerar persona (${++falhasPersona}): `+(out?.__erro||''),'w');
    });
    E.agentes.sort((a,b)=>a.id-b.id);
    if(!E.agentes.length)
      throw new Error('nenhuma persona foi gerada — verifique a chave, o modelo e o limite de tokens do provedor');
    if(E.agentes.length < vagas.length*0.6)
      log(`atenção: só ${E.agentes.length} de ${vagas.length} pessoas foram geradas — o corpo ficou raso`,'w');
    setBar(100, `${E.agentes.length} pessoas prontas`);
    log('corpo gerado: '+E.agentes.length+' pessoas');

    $('#corpoFim').innerHTML = `
      <div class="card">
        <div class="k">PRONTO PARA RODAR</div>
        <p class="small muted">A simulação avança marco a marco. Em cada marco só uma parte do
        corpo se manifesta — quem está exposto àquelas decisões, quem é reativo, quem tem voz.
        O que essas pessoas fizerem calibra o motor do marco seguinte.</p>
        <button class="btn" id="b_sim">RODAR A SIMULAÇÃO →</button>
        <button class="btn ghost sm" id="b_v2" style="margin-left:8px">VOLTAR ÀS AÇÕES</button>
      </div>`;
    $('#b_sim').onclick = ()=>{ ir(3); iniciarSimulacao(); };
    $('#b_v2').onclick = ()=>ir(1);
  }catch(e){
    log('erro na geração do corpo: '+e.message,'e');
    $('#corpoFim').innerHTML = `<div class="err"><b>Não deu para gerar o corpo.</b><br>${esc(e.message)}
      <br><br><button class="btn ghost sm" id="b_retry">TENTAR DE NOVO</button>
      <button class="btn ghost sm" id="b_v3" style="margin-left:8px">VOLTAR</button></div>`;
    $('#b_retry').onclick = ()=>iniciarCorpo();
    $('#b_v3').onclick = ()=>ir(1);
  }
}

function renderSimulacao(){
  $('#hdL').textContent = 'ETAPA 4 · OS MARCOS';

      <div class="marco-hd"><span class="yr">${y}</span>
      <span class="mono small muted">aguardando</span></div></div>`).join('');
    $('#bdR').innerHTML = `<div class="mono small muted" id="falasVazio">o corpo ainda não se manifestou.</div><div id="falas"></div>`;
  }

async function iniciarSimulacao(){
  renderSimulacao();
  if(E.rodando) return; E.rodando = true;
  E.corrida = criarCorrida(E.sel, E.ctx, 3000, 20260724);
  E.fotos=[]; E.historico=[]; E.narrativas=[]; E.calibs=[];
  let anterior = null, deltaAnt = null;
  log('motor iniciado — 3.000 trajetórias, Co estrutural '+E.corrida.coerencia.valor.toFixed(2),'h');

  try{
    for(const marco of MARCOS){
      const estado = E.corrida.estadoAtual();
      const box = $('#m'+marco);
      box.classList.remove('pend');
      box.innerHTML = `<div class="marco-hd"><span class="yr">${marco}</span>
        <span class="mono small muted"><span class="spin"></span> o corpo está reagindo…</span></div>`;

      /* --- rodada do enxame --- */
      const ativos = ativar(E.agentes, marco, estado);
      log(`${marco}: ${ativos.length} de ${E.agentes.length} pessoas se manifestam`);
      if($('#falasVazio')) $('#falasVazio').remove();
      const cab = document.createElement('div');
      cab.innerHTML = `<div class="k" style="margin:18px 0 10px;border-top:1px solid var(--line);padding-top:14px">
        ${marco} · ${ativos.length} MANIFESTAÇÕES</div>`;
      $('#falas').appendChild(cab);

      const anteriorRodada = E.historico[E.historico.length-1] || [];
      const falas = []; let falhasFala = 0;
      await emLotes(ativos, async (ag)=>{
        const feed = montarFeed(ag, anteriorRodada, marco, estado, deltaAnt);
        const f = await agirNoMarco(ag, feed, E.ctx, E.sel, marco);
        return f;
      }, 5, (out)=>{
        if(out && !out.__erro){
          falas.push(out);
          const ag = E.agentes.find(a=>a.id===out.id);
          if(ag){ ag.memoria.push({ano:marco, postura:out.postura, fala:out.fala});
                  if(out.postura==='sai') ag.saiu = true; }
          addFala(out);
        } else log(`uma pessoa não respondeu (${++falhasFala}): `+(out?.__erro||''),'w');
      });
      E.historico.push(falas);

      /* --- calibração e passo do motor --- */
      const cal = calibrar(falas);
      E.calibs.push(cal);
      log(`${marco}: adesão real ${(cal.alpha*100).toFixed(0)}% · contradição vivida ${(cal.contradicao*100).toFixed(0)}%`);
      const foto = E.corrida.passo(cal);
      E.fotos.push(foto);

      const novo = E.corrida.estadoAtual();
      deltaAnt = novo.R.map((v,j)=>v-estado.R[j]); deltaAnt[6] = novo.Y - estado.Y;

      box.innerHTML = pintarMarco(foto, cal, falas, null);
      box.querySelector('.narr-slot').innerHTML = '<span class="spin"></span> <span class="mono small muted">escrevendo o retrato…</span>';

      /* --- camada narrativa --- */
      let narr = '';
      try{ narr = await narrarMarco(marco, foto, falas, cal, E.ctx, anterior); }
      catch(e){ narr = ''; log('não deu para narrar '+marco+': '+e.message,'w'); }
      E.narrativas.push(narr);
      box.querySelector('.narr-slot').innerHTML = narr
        ? `<div class="narr">${narr.split(/\n{2,}/).map(p=>`<p>${esc(p)}</p>`).join('')}</div>`
        : `<div class="muted small">retrato não gerado.</div>`;
      anterior = foto;
    }

    log('simulação concluída','h');
    $('#simFim').innerHTML = `<div class="card"><div class="k">FIM DA TRAJETÓRIA</div>
      <button class="btn" id="b_rel">ESCREVER O RELATO FINAL →</button></div>`;
    $('#b_rel').onclick = ()=>{ ir(4); iniciarRelato(); };
  }catch(e){
    log('erro na simulação: '+e.message,'e');
    $('#simFim').innerHTML = `<div class="err"><b>A simulação parou.</b><br>${esc(e.message)}</div>`;
  }finally{ E.rodando=false; }
}

  <div class="marco-hd"><span class="yr">${f.ano}</span>

  <div class="marco-bd">
    <div class="contas">

    </div>
    <div class="reservas">
      ${f.R.map((r,j)=>{
        const cor = r.p50>=60?'var(--ok)': r.p50>=35?'var(--warn)':'var(--bad)';
        return `<div class="res"><div class="rn">${RESERVAS[j].nome}</div>
          <div class="bar">
            <div class="fill" style="height:${r.p50}%;background:${cor}"></div>
            <div class="band" style="bottom:${r.p10}%;height:${Math.max(1,r.p90-r.p10)}%"></div>
          </div><div class="rv" style="color:${cor}">${r.p50.toFixed(0)}</div></div>`;
      }).join('')}
    </div>
    <div class="crise">
      <i style="flex:${d.quebra||0.001};background:var(--bad)"></i>

      ${(100*d.aguenta/tot).toFixed(0)}% absorvidos · ${(100*d.fortalece/tot).toFixed(0)}% fortaleceram

      <div class="cal"><div class="cl">SE MANIFESTARAM</div><div class="cv">${cal.n}</div></div>
    </div>
    <div style="margin-bottom:10px">${post}</div>

function desenharGrafico(){
  const cv = $('#graf'); if(!cv) return;
  const g = cv.getContext('2d'), W=cv.width, H=cv.height, pad=32;
  g.clearRect(0,0,W,H);
  const anos = E.fotos.map(f=>f.ano);
  const x = a => pad + (a-2026)/(2050-2026)*(W-2*pad);
  const maxY = Math.max(160, ...E.fotos.map(f=>f.Y.p90));
  const yY = v => H-pad - (v/maxY)*(H-2*pad);
  const yS = v => H-pad - (v/100)*(H-2*pad);
  g.strokeStyle='#2A1428'; g.lineWidth=1;
  [0,.25,.5,.75,1].forEach(t=>{ const yy=pad+t*(H-2*pad); g.beginPath(); g.moveTo(pad,yy); g.lineTo(W-pad,yy); g.stroke(); });
  const banda=(cor,get,esc)=>{ g.beginPath();
    E.fotos.forEach((f,i)=>{const p=get(f); i?g.lineTo(x(f.ano),esc(p.p90)):g.moveTo(x(f.ano),esc(p.p90));});
    for(let i=E.fotos.length-1;i>=0;i--){const f=E.fotos[i],p=get(f); g.lineTo(x(f.ano),esc(p.p10));}
    g.closePath(); g.fillStyle=cor; g.fill(); };
  const linha=(cor,get,esc)=>{ g.beginPath();
    E.fotos.forEach((f,i)=>{const p=get(f); i?g.lineTo(x(f.ano),esc(p.p50)):g.moveTo(x(f.ano),esc(p.p50));});
    g.strokeStyle=cor; g.lineWidth=2; g.stroke();
    E.fotos.forEach(f=>{const p=get(f); g.fillStyle=cor; g.beginPath(); g.arc(x(f.ano),esc(p.p50),3,0,7); g.fill();}); };
  banda('#FF00AA22', f=>f.Y, yY); banda('#FFFF0018', f=>f.S, yS);
  linha('#FF00AA', f=>f.Y, yY);   linha('#FFFF00', f=>f.S, yS);
  g.fillStyle='#6E5A76'; g.font='10px ui-monospace,monospace';
  anos.forEach(a=>g.fillText(a, x(a)-14, H-12));
  g.fillStyle='#FF00AA99'; g.textAlign='right';
  [0,0.5,1].forEach(t=>g.fillText(Math.round(maxY*t), pad-5, yY(maxY*t)+3));
  g.fillStyle='#FFFF0099'; g.textAlign='left';
  [0,50,100].forEach(v=>g.fillText(v, W-pad+5, yS(v)+3));
  g.textAlign='left';
}

function renderChat(){
  const alvos = [{k:'relator', n:'A conta inteira', d:'quem escreveu o relato'}]
    .concat(E.agentes.slice(0,60).map(a=>({k:'a'+a.id, n:a.nome, d:a.cargo})));
  const hist = E.chat[E.chatAlvo] || [];
  $('#bdR').innerHTML = `
    <div class="card">
      <div class="k">COM QUEM VOCÊ QUER FALAR</div>
      <p class="small muted">Estamos em 2050. Dá para perguntar à conta inteira, ou a qualquer
      pessoa do corpo — ela responde a partir do que viveu, não do relatório.</p>
      <div class="alvo">${alvos.map(t=>`<div class="t ${E.chatAlvo===t.k?'on':''}" data-k="${t.k}">
        <b>${esc(t.n)}</b><br><span class="mono small muted">${esc(t.d)}</span></div>`).join('')}</div>
    </div>
    <div class="card">
      <div class="chat" id="chatBox">${hist.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}">${esc(m.content)}</div>`).join('')
        || '<div class="muted small">nenhuma pergunta ainda.</div>'}</div>
      <textarea class="i" id="q" rows="2" placeholder="sua pergunta"></textarea>
      <div style="margin-top:8px"><button class="btn sm" id="b_q">PERGUNTAR</button>
        <span class="mono small muted" id="qst" style="margin-left:10px"></span></div>
    </div>`;
  $('#bdR').querySelectorAll('.alvo .t').forEach(el=>el.onclick=()=>{ E.chatAlvo=el.dataset.k; renderChat(); });
  const enviar = async ()=>{
    const alvo = E.chatAlvo;                 // congela: o usuário pode trocar de alvo durante o await
    const q = $('#q').value.trim(); if(!q) return;
    $('#q').value=''; $('#qst').innerHTML='<span class="dotpulse"></span>';
    const hist = (E.chat[alvo] = E.chat[alvo] || []);
    hist.push({role:'user',content:q});
    renderChatMsgs();
    try{
      let r;
      if(alvo==='relator') r = await perguntarAoRelator(q, hist, E.relatorio, E.ctx, E.fotos, E.historico);
      else{ const a = E.agentes.find(x=>'a'+x.id===alvo);
            r = a ? await entrevistar(a, q, hist, E.ctx, E.fotos) : '(pessoa não encontrada)'; }
      hist.push({role:'assistant',content:r});
    }catch(e){ hist.push({role:'assistant',content:'(não consegui responder: '+e.message+')'}); }
    if($('#qst')) $('#qst').textContent='';
    if(E.chatAlvo===alvo) renderChatMsgs();
  };
  $('#b_q').onclick = enviar;
  $('#q').addEventListener('keydown', ev=>{ if(ev.key==='Enter'&&!ev.shiftKey){ ev.preventDefault(); enviar(); }});
}
function renderChatMsgs(){
  const h = E.chat[E.chatAlvo]||[];
  const b = $('#chatBox'); if(!b) return;
  b.innerHTML = h.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}">${esc(m.content)}</div>`).join('');
  b.scrollTop = b.scrollHeight;
}

/* ---------- exportação ---------- */
function baixar(nome, txt, tipo){
  const b = new Blob([txt],{type:tipo}); const u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href=u; a.download=nome; a.click(); URL.revokeObjectURL(u);
}
function baixarMd(){
  let m = `# ${E.ctx.nome} — Calculadora de Coerência v3\n\n`;
  m += `${SETORES[E.ctx.setor].nome} · ${PORTES[E.ctx.porte].nome} · ${MOMENTOS[E.ctx.momento].nome}\n\n`;
  m += `Ações: ${E.sel.map(id=>id+' '+ACOES[id].nome).join('; ')}\n\n`;
  m += `Coerência estrutural: ${E.corrida.coerencia.valor.toFixed(2)}\n\n---\n\n${E.relatorio}\n\n---\n\n`;
  E.fotos.forEach((f,i)=>{
    m += `## ${f.ano}\n\nDesempenho ${f.Y.p50.toFixed(0)} [${f.Y.p10.toFixed(0)}–${f.Y.p90.toFixed(0)}] · `;
    m += `solo ${f.S.p50.toFixed(0)} · quebra acumulada ${(f.taxaQuebra*100).toFixed(1)}% · direção ${f.frequencia}\n\n`;
    m += `Reservas: ${f.R.map((r,j)=>RESERVAS[j].nome+' '+r.p50.toFixed(0)).join(', ')}\n\n`;
    m += `Adesão real ${(E.calibs[i].alpha*100).toFixed(0)}% · coerência vivida ${(E.calibs[i].coerViva*100).toFixed(0)}%\n\n`;
    m += (E.narrativas[i]||'')+'\n\n';
    m += `### Vozes\n\n` + E.historico[i].map(f2=>`> **${f2.nome}** (${f2.cargo}) — ${POSTURAS[f2.postura].rot}: "${f2.fala}"`).join('\n\n')+'\n\n';
  });
  baixar('calculadora-coerencia-'+E.ctx.nome.replace(/\W+/g,'-').toLowerCase()+'.md', m, 'text/markdown');
}
function baixarJson(){
  baixar('calculadora-coerencia-dados.json', JSON.stringify({
    contexto:E.ctx, acoes:E.sel, coerencia:E.corrida.coerencia,
    ontologia:E.ontologia, agentes:E.agentes.map(({memoria,...a})=>({...a,memoria})),
    fotos:E.fotos.map(({...f})=>f), calibracoes:E.calibs,
    falas:E.historico, narrativas:E.narrativas, relatorio:E.relatorio,
    parametros:P, chamadas:CHAMADAS
  },null,2), 'application/json');
}
